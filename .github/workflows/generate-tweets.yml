name: Generate LIV Network tweets

on:
  # ── SEASON SCHEDULE (enabled Sep 7 2026): daily at 1:00 PM Eastern ──
  # GitHub cron runs in UTC. 17:00 UTC = 1pm EDT (Mar-Nov).
  # After daylight saving ends in November, change to '0 18 * * *' to stay at 1pm EST.
  schedule:
    - cron: '0 17 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  tweets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate tweets
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/generate_tweets.py

      - name: Commit tweets.json if changed
        run: |
          git config user.name "liv-network-bot"
          git config user.email "actions@github.com"
          git add tweets.json
          if git diff --cached --quiet; then
            echo "No new tweets to commit."
          else
            git commit -m "LIV Network: fresh tweets $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
