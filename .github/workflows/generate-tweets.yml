name: Generate LIV Network tweets

on:
  # ── OFFSEASON: scheduled runs disabled Jul 20 2026 ──
  # To re-enable for the season, uncomment the schedule block below.
  # (cron '0 */6 * * *' = every 6 hours / 4 runs per day)
  # schedule:
  #   - cron: '0 */6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  tweets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate tweets
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/generate_tweets.py

      - name: Commit tweets.json if changed
        run: |
          git config user.name "liv-network-bot"
          git config user.email "actions@github.com"
          git add tweets.json
          if git diff --cached --quiet; then
            echo "No new tweets to commit."
          else
            git commit -m "LIV Network: fresh tweets $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
